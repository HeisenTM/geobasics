<style>
:root{
  --bg:#1f1f1e;
  --panel:#2a2a28;
  --panel-hover:#323230;
  --line:#3d3d3a;
  --text:#f2f1ed;
  --muted:#a3a29c;
  --accent:#f2f1ed;
  --accent-ink:#1f1f1e;
  --radius:14px;
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

.wrap{max-width:680px;margin:0 auto;padding:clamp(16px,3vw,32px) 20px 48px}

header{margin-bottom:32px;display:flex;align-items:center;gap:26px}
.logo{width:140px;height:auto;flex:none;display:block}
.intro{border-left:1px solid var(--line);padding-left:26px}
h1{font-size:clamp(1.6rem,4.5vw,2.2rem);line-height:1.15;letter-spacing:-.02em;font-weight:750}
.lead{color:var(--muted);margin-top:8px;font-size:1rem;line-height:1.5}

/* Levels path */
.levels{list-style:none;padding:0;position:relative}
.levels::before{
  content:"";position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:var(--line);
}
.level{position:relative;padding-left:60px;margin-bottom:12px}
.level:last-child{margin-bottom:0}
.num{
  position:absolute;left:0;top:14px;width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;font-weight:700;font-size:1rem;
  background:var(--bg);border:2px solid var(--line);color:var(--muted);
}
.card{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;transition:background .15s,border-color .15s;
}
.card h2{font-size:1.1rem;font-weight:650;letter-spacing:-.005em}
.card p{color:var(--muted);font-size:.93rem;margin-top:2px}
.tag{
  flex:none;font-size:.82rem;font-weight:600;padding:6px 12px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);white-space:nowrap;
}
a.card:hover{background:var(--panel-hover);border-color:var(--accent)}
.level.ready .num{border-color:var(--accent);color:var(--accent)}
.level.ready .tag{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.level.soon .card{opacity:.7}

footer{margin-top:32px;color:var(--muted);font-size:.88rem}

@media (max-width:480px){
  header{flex-direction:column;align-items:flex-start;gap:16px}
  .intro{border-left:0;padding-left:0}
  .logo{width:120px}
  .tag{display:none}
  .card{padding:14px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

    <div class="intro">
      <h1>Learn GeoGuessr.</h1>
      <p class="lead">Easiest clues first, tricky ones last.</p>
    </div>
  </header>

  <main>
    <ol class="levels" id="levels"></ol>
  </main>

  <footer>New levels are added over time.</footer>
</div>

<script>
/*
  EDIT YOUR LEVELS HERE.
  - title / desc: text shown on the home page
  - href:  the level's folder, e.g. "hemisphere/" (it contains that level's index.html)
  - ready: set to true once the page exists, so the card becomes a link
  Add, remove or reorder items freely; numbers update automatically.
*/
const LEVELS = [
  { title: "Learn Hemisphere",                desc: "Tell north from south using the sun and the seasons.",    href: "hemisphere/", ready: true  },
  { title: "Learn Road Lines",                desc: "Read center lines and edge lines to find the region.",    href: "road-lines/", ready: false },
  { title: "Learn Common Languages",          desc: "Recognize the most common scripts and languages on signs.", href: "languages/",  ready: false },
  { title: "Learn Bollards",                  desc: "Match bollard styles to the countries that use them.",    href: "bollards/",   ready: false },
  { title: "Learn Poles",                     desc: "Use utility pole shapes as a late-game clue.",            href: "poles/",      ready: false }
];

const list = document.getElementById("levels");
const frag = document.createDocumentFragment();

LEVELS.forEach((lv, i) => {
  const li = document.createElement("li");
  li.className = "level " + (lv.ready ? "ready" : "soon");

  const num = document.createElement("span");
  num.className = "num";
  num.textContent = i + 1;

  const card = document.createElement(lv.ready ? "a" : "div");
  card.className = "card";
  if (lv.ready) card.href = lv.href;

  const text = document.createElement("div");
  const h = document.createElement("h2");
  h.textContent = lv.title;
  const p = document.createElement("p");
  p.textContent = lv.desc;
  text.append(h, p);

  const tag = document.createElement("span");
  tag.className = "tag";
  tag.textContent = lv.ready ? "Start" : "Coming soon";

  card.append(text, tag);
  li.append(num, card);
  frag.appendChild(li);
});

list.appendChild(frag);
</script>
